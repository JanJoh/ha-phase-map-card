name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    # HACS validation reads the repository anonymously, so on a private repo it
    # sees no manifest and calls hacs.json invalid. Runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dist/phase-bus-card.js
